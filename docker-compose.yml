services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lazofood
      POSTGRES_PASSWORD: lazofood
      POSTGRES_DB: lazofood
    ports:
      - "5432:5432"
    volumes:
      - lazofood_db_data:/var/lib/postgresql/data

volumes:
  lazofood_db_data:
